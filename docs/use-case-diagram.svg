<svg viewBox="0 0 1120 750" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Use case diagram: Guest can register and log in; Passenger can browse the fleet, book seats, cancel bookings, view tickets and the dashboard; Staff and Admin additionally manage vehicles, routes, trips, drivers, passengers, bookings and reports; Admin alone accesses the Django admin site and generalizes from Staff. Booking includes seat-availability checking and QR ticket generation; the dashboard is extended by a revenue and status breakdown for Staff and Admin.">
