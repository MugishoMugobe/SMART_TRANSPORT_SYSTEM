{% extends "base.html" %}

{% block content %}

<h2>Route Form</h2>

<form method="post">

    {% csrf_token %}

    {{ form.as_p }}

    <button class="btn btn-primary">
        Save
    </button>

    <a href="{% url 'routes:list' %}"
       class="btn btn-secondary">
        Cancel
    </a>

</form>

{% endblock %}
