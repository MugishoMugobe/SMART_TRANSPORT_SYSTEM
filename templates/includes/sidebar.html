{% with role=request.user.profile.role app=request.resolver_match.app_name %}

<div class="sidebar-section">
    <span class="sidebar-label">Overview</span>

    <a href="/dashboard/" class="sidebar-link {% if app == 'dashboard' %}active{% endif %}">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <rect x="3.5" y="3.5" width="7" height="7" rx="1.4" stroke="currentColor" stroke-width="1.6"/>
            <rect x="13.5" y="3.5" width="7" height="7" rx="1.4" stroke="currentColor" stroke-width="1.6"/>
            <rect x="3.5" y="13.5" width="7" height="7" rx="1.4" stroke="currentColor" stroke-width="1.6"/>
            <rect x="13.5" y="13.5" width="7" height="7" rx="1.4" stroke="currentColor" stroke-width="1.6"/>
        </svg>
        Dashboard
    </a>
</div>

<div class="sidebar-section">
    <span class="sidebar-label">Operations</span>

    <a href="/vehicles/" class="sidebar-link {% if app == 'vehicles' %}active{% endif %}">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <rect x="3" y="6" width="18" height="10.5" rx="2.5" stroke="currentColor" stroke-width="1.6"/>
            <path d="M3 11h18" stroke="currentColor" stroke-width="1.6"/>
            <circle cx="7.5" cy="19" r="1.6" stroke="currentColor" stroke-width="1.6"/>
            <circle cx="16.5" cy="19" r="1.6" stroke="currentColor" stroke-width="1.6"/>
        </svg>
        Vehicles
    </a>

    <a href="/routes/" class="sidebar-link {% if app == 'routes' %}active{% endif %}">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="5.5" cy="18.5" r="2" stroke="currentColor" stroke-width="1.6"/>
            <circle cx="18.5" cy="5.5" r="2" stroke="currentColor" stroke-width="1.6"/>
            <path d="M7 17c4-1 3-6 6-8.5S18 6 18 6" stroke="currentColor" stroke-width="1.6" stroke-dasharray="2.4 2.6" stroke-linecap="round"/>
        </svg>
        Routes
    </a>

    <a href="/trips/" class="sidebar-link {% if app == 'trips' %}active{% endif %}">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <rect x="3.5" y="4.5" width="17" height="16" rx="2.2" stroke="currentColor" stroke-width="1.6"/>
            <path d="M3.5 9.5h17M8 3v3M16 3v3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
        Trips
    </a>

    <a href="/bookings/" class="sidebar-link {% if app == 'bookings' %}active{% endif %}">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M3.5 9a2 2 0 0 0 0-4V4.5h17V5a2 2 0 0 0 0 4v0a2 2 0 0 0 0 4v0a2 2 0 0 0 0 4v.5h-17V17a2 2 0 0 0 0-4v0a2 2 0 0 0 0-4Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
            <path d="M10 4.5v15" stroke="currentColor" stroke-width="1.5" stroke-dasharray="2 2"/>
        </svg>
        Bookings
    </a>
</div>

{% if request.user.is_superuser or role == "STAFF" or role == "ADMIN" %}

<div class="sidebar-section">
    <span class="sidebar-label">People</span>

    <a href="/passengers/" class="sidebar-link {% if app == 'passengers' %}active{% endif %}">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="12" cy="7.5" r="3.4" stroke="currentColor" stroke-width="1.6"/>
            <path d="M4.5 20c1.4-3.8 4.6-5.8 7.5-5.8s6.1 2 7.5 5.8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
        Passengers
    </a>

    <a href="/drivers/" class="sidebar-link {% if app == 'drivers' %}active{% endif %}">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="1.6"/>
            <circle cx="12" cy="12" r="2.6" stroke="currentColor" stroke-width="1.6"/>
            <path d="M12 4v3.4M12 16.6V20M4.9 7.5l2.9 1.7M16.2 14.8l2.9 1.7M4.9 16.5l2.9-1.7M16.2 9.2l2.9-1.7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
        Drivers
    </a>
</div>

<div class="sidebar-section">
    <span class="sidebar-label">Insights</span>

    <a href="/reports/" class="sidebar-link {% if app == 'reports' %}active{% endif %}">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M4.5 19.5v-6M11 19.5v-11M17.5 19.5V9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            <path d="M3.5 19.5h17" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
        Reports
    </a>
</div>

{% endif %}

{% endwith %}
