<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1">

<title>Smart Transport System</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">

<style>
    /* Every form on the site renders with {{ form.as_p }}, which already
       prints Django's field/non-field errors — this just makes them read
       as feedback instead of stray unstyled bullet points. Global on
       purpose, so every create/update form gets it for free. */
    ul.errorlist {
        list-style: none;
        padding: 0;
        margin: 0.25rem 0 0.5rem;
    }
    ul.errorlist li {
        color: #dc3545;
        font-size: 0.875rem;
        background: #fdecea;
        border: 1px solid #f3c6c1;
        border-radius: 0.375rem;
        padding: 0.35rem 0.6rem;
        margin-bottom: 0.25rem;
    }
    ul.errorlist.nonfield li {
        font-size: 0.95rem;
    }
    form p:has(ul.errorlist) input,
    form p:has(ul.errorlist) select,
    form p:has(ul.errorlist) textarea {
        border-color: #dc3545;
    }
</style>

</head>

<body>

{% include "includes/navbar.html" %}

<div class="container-fluid mt-3">

    <div class="row">

        <div class="col-md-2">

            {% include "includes/sidebar.html" %}

        </div>

        <div class="col-md-10">

            {% include "includes/messages.html" %}

            {% block content %}

            {% endblock %}

        </div>

    </div>

</div>

{% include "includes/footer.html" %}

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
