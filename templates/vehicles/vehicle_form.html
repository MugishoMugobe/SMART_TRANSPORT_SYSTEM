{% extends "base.html" %}

{% block content %}

<h2>Vehicle Form</h2>

<form method="post" enctype="multipart/form-data">

    {% csrf_token %}

    {{ form.as_p }}

    <button class="btn btn-primary">
        Save
    </button>

    <a href="{% url 'vehicles:list' %}"
       class="btn btn-secondary">

        Cancel

    </a>

</form>

{% endblock %}
